<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Productivity Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><div><p class="eyebrow">STUDENT SPACE</p><h1>Productivity Dashboard</h1><p>Plan your day. Make progress.</p></div><div class="date" id="today"></div></header><main><section class="stats"><article><span>Total tasks</span><strong id="total">0</strong></article><article><span>Completed</span><strong id="done">0</strong></article><article><span>Pending</span><strong id="pending">0</strong></article><article><span>Progress</span><strong id="progress">0%</strong></article></section><section class="progressWrap"><div class="progressTrack"><div id="progressBar"></div></div></section><div class="layout"><section class="panel"><h2 id="formTitle">Add a task</h2><form id="taskForm"><input type="hidden" id="editId"><label>Task title<input id="title" required maxlength="100" placeholder="e.g. Revise CSS selectors"></label><label>Notes<textarea id="notes" rows="3" placeholder="Details or study notes"></textarea></label><label>Deadline<input type="date" id="deadline"></label><label>Daily goal<input id="goal" placeholder="e.g. Study for 30 minutes"></label><div class="buttons"><button class="primary" type="submit" id="saveBtn">Add task</button><button type="button" id="cancelEdit" class="secondary" hidden>Cancel edit</button></div></form></section><section class="panel"><div class="listHead"><h2>Your tasks</h2><input id="search" placeholder="Search tasks..."></div><div class="filters"><button class="filter active" data-filter="all">All</button><button class="filter" data-filter="pending">Pending</button><button class="filter" data-filter="completed">Completed</button></div><div id="taskList" class="taskList"></div><p id="empty" class="empty">No tasks yet. Add your first task!</p></section></div><footer>Saved automatically in this browser using Local Storage.</footer></main><script src="script.js"></script></body></html>
